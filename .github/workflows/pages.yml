name: Deploy NexusFleet Simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexusfleet-pages-v2
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate simulator
        run: npm test

      - name: Build simulation site
        env:
          NEXUSFLEET_BASE_PATH: /NexusFleet
        run: |
          npm run build:web
          printf '%s\n' '{"simulation":true,"profile":"reboot-quest-kiosk","realDeviceWrites":false}' > out/simulation.json
          touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
