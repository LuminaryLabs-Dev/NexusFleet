name: Deploy NexusFleet Simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexusfleet-pages-v2
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate simulator
        run: npm test

      - name: Build simulation site
        run: |
          rm -rf dist
          mkdir -p dist/src/core dist/src/adapters dist/src/runtime
          cp web/index.html web/app.js web/styles.css dist/
          cp src/core/device.js src/core/fleet-engine.js dist/src/core/
          cp src/adapters/mock-adb.js src/adapters/mock-fastboot.js dist/src/adapters/
          cp src/runtime/command-surface.js dist/src/runtime/
          sed -i "s|'../src/core/|'./src/core/|g" dist/app.js
          sed -i "s|'../src/adapters/|'./src/adapters/|g" dist/app.js
          sed -i "s|'../src/runtime/|'./src/runtime/|g" dist/app.js
          printf '%s\n' '{"simulation":true,"profile":"reboot-quest-kiosk","realDeviceWrites":false}' > dist/simulation.json
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
